# Push a tag like v9.1.0 and this builds the Windows app and the web version,
# then publishes them on the repository's Releases page.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Stamp the version into the Windows resources
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-mingw-w64-x86-64
          python3 tools/set_version.py "${GITHUB_REF_NAME#v}"
          cd res && x86_64-w64-mingw32-windres --preprocessor=cat -O coff -i app.rc -o ../rsrc_windows_amd64.syso
      - name: Build the Windows app
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
            -ldflags "-H windowsgui -s -w -X main.version=${GITHUB_REF_NAME#v}" \
            -o dist/SkylandersPortalMaster.exe .
      - name: Build the web version
        run: |
          GOOS=js GOARCH=wasm go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}" -o dist/core.wasm .
          python3 tools/build_web.py dist/core.wasm "$(go env GOROOT)/lib/wasm/wasm_exec.js" dist/SkylandersPortalMaster-web.html
      - name: Checksums
        run: cd dist && sha256sum SkylandersPortalMaster.exe SkylandersPortalMaster-web.html > SHA256SUMS.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "Skylanders Portal Master ${GITHUB_REF_NAME}" --generate-notes \
            dist/SkylandersPortalMaster.exe dist/SkylandersPortalMaster-web.html dist/SHA256SUMS.txt
