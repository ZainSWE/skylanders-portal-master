name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet (all three builds)
        run: |
          go vet ./...
          GOOS=windows GOARCH=amd64 go vet -unsafeptr=false ./...
          GOOS=js GOARCH=wasm go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o /dev/null .
          GOOS=js GOARCH=wasm go build -trimpath -o /dev/null .
